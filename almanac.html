<title>The Arcasian Almanac - Republic of Arcasia</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--n:#0c2f62;--nb:#17499a;--r:#b01c44;--w:#e8eef9;--d:#7f93b8;--g:#d9b45a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--w);font:500 16px/1.5 Rajdhani,'Arial Narrow',sans-serif;letter-spacing:.03em}
body{min-height:100%;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:radial-gradient(1200px 600px at 50% -10%,#0d2450,transparent),var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
header{display:flex;align-items:center;gap:18px;padding:18px 22px;border-bottom:2px solid var(--nb);background:#07142bcc}
header img.lg{width:96px;border:0}header img{width:96px;border:2px solid #fff;display:block}
.cls{color:var(--r);border:1px solid var(--r);padding:0 8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
h1{margin:0;font-size:28px;text-transform:uppercase;letter-spacing:.14em}header p{margin:2px 0 0;color:var(--d);font-size:14px;text-transform:uppercase;letter-spacing:.12em}
nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px 22px 0;border-bottom:1px solid var(--nb)}
nav a{padding:5px 16px;color:var(--d);text-decoration:none;text-transform:uppercase;letter-spacing:.14em;border:1px solid transparent;border-bottom:0}
nav a:hover{color:var(--w)}nav a.on{color:#fff;background:var(--n);border-color:var(--nb)}
main{max-width:1060px;margin:0 auto;padding:22px}
section{display:none}section.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{margin:0 0 4px;font-size:24px;text-transform:uppercase;letter-spacing:.14em;border-left:5px solid var(--r);padding-left:12px}
.sub{color:var(--d);margin:0 0 16px 17px;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--nb);background:#08173179;padding:12px 14px;border-top:3px solid var(--c,var(--nb))}
.card h3{margin:0 0 2px;font-size:19px;text-transform:uppercase;letter-spacing:.08em;color:#fff}
.card .tag{font-size:12px;color:var(--c,var(--g));text-transform:uppercase;letter-spacing:.16em}
.card p{margin:6px 0 0;color:#c6d2ea;font-size:15px;line-height:1.4}
.card ul{margin:8px 0 0;padding:0;list-style:none}.card li{font-size:14px;color:#c6d2ea;padding:3px 0;border-top:1px dashed #17499a66}
.card li b{color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.stat{border:1px solid var(--nb);padding:8px 12px;background:#0c2f6240}.stat b{display:block;font-size:30px;line-height:1.1;color:#fff}.stat span{font-size:12px;color:var(--d);text-transform:uppercase;letter-spacing:.14em}
.lead{border-left:3px solid var(--g);padding:2px 14px;margin:0 0 18px;color:#d5def2;font-size:17px}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--nb);padding-left:22px}
.tl div{position:relative;margin:0 0 18px}.tl div::before{content:"";position:absolute;left:-29px;top:6px;width:10px;height:10px;background:var(--r);border:2px solid var(--bg);border-radius:50%}
.tl h3{margin:0;font-size:19px;color:#fff;text-transform:uppercase;letter-spacing:.08em}.tl h3 span{color:var(--g);margin-right:10px}.tl p{margin:3px 0 0;color:#c6d2ea;font-size:15px}
.redact{background:#e8eef9;color:#e8eef9;cursor:pointer;transition:.25s;padding:0 3px}.redact:hover,.redact.u{background:transparent;color:var(--r)}
.q{margin-top:22px;text-align:center;color:var(--d);font-size:15px;text-transform:uppercase;letter-spacing:.2em}
footer{text-align:center;padding:18px;color:var(--d);font-size:12px;text-transform:uppercase;letter-spacing:.2em;border-top:1px solid var(--nb)}
a.map{display:inline-block;margin-top:14px;padding:6px 16px;border:1px solid var(--g);color:var(--g);text-decoration:none;text-transform:uppercase;letter-spacing:.14em}a.map:hover{background:var(--g);color:#000}
@media(max-width:640px){header{padding:12px}header img{width:64px}h1{font-size:20px}nav{padding:6px 8px 0}nav a{padding:4px 9px;font-size:14px}main{padding:14px}}
@media(prefers-reduced-motion:reduce){section.on{animation:none}}
</style></head><body>

const sec=(id,h,s,b)=>'<section id="'+id+'"><h2>'+h+'</h2><p class="sub">'+s+'</p>'+b+'</section>';
const V={
overview:sec('overview','The Republic','Republic of Arcasia · Ventrie City','<div class="stats"><div class="stat"><b>1957</b><span>Current year</span></div><div class="stat"><b>Walker</b><span>President, third term</span></div><div class="stat"><b>9</b><span>Regions</span></div><div class="stat"><b>235</b><span>House seats</span></div><div class="stat"><b>Xina</b><span>Active deployment</span></div></div><p class="lead">The shining city on the hill is quiet. The army holds the streets, New Street holds its breath, and the Dream has become a rumor. Published each year for the citizens of the Republic, this almanac records its government, economy, history and leading figures. Some entries are <span class="redact">withheld by order of the Office of Public Information</span>.</p><a class="map" href="index.html">Open the Regional Elections Map</a><p class="q">It is finally morning in Arcasia.</p>'),
government:sec('government','Government','Parties, factions and the Assembly','<p class="lead">Dwight Walker rules by a thin three-seat majority, a packed Kleber Court and the doctrine of the Administrative Presidency.</p><div class="grid">'+parties.map(p=>card(p[0]+' ('+p[1]+')','Party',p[3],p[2],p[4])).join('')+'</div>'),
economy:sec('economy','Economy','The Walker Plan and what remains of it','<p class="lead">Tax cuts, deregulation and shock therapy lifted millions and made the Lira the strongest currency on earth. Then came the recession, capital flight and stagflation.</p><div class="grid">'+econ.map(e=>card(e[0],e[1],e[2],'#d9b45a')).join('')+'</div>'),
history:sec('history','History','1946 to 1957','<div class="tl">'+hist.map(h=>'<div><h3><span>'+h[0]+'</span>'+h[1]+'</h3><p>'+h[2]+'</p></div>').join('')+'</div>'),
dossiers:sec('dossiers','Who&#39;s Who','Leading figures of the Republic','<div class="grid">'+dos.map(d=>card(d[0],d[1],d[4],d[3])).join('')+'</div>'),
network:sec('network','Institutions','Agencies, movements and the press','<div class="lead">The bodies that shape public life in the Republic, from the agencies of state to the presses of the street.</div>'+net.map(n=>'<h2 style="font-size:19px;margin:18px 0 10px">'+n[0]+'</h2><div class="grid">'+n[1].map(x=>card(x[0],'',x[1],'#17499a')).join('')+'</div>').join(''))
};
const nav=document.getElementById('nav'),m=document.getElementById('m');
nav.innerHTML=T.map(t=>'<a href="#'+t[0]+'" data-t="'+t[0]+'">'+t[1]+'</a>').join('');
m.innerHTML=T.map(t=>V[t[0]]).join('');
m.addEventListener('click',e=>{if(e.target.classList.contains('redact'))e.target.classList.toggle('u')});
const go=()=>{const h=(location.hash||'#overview').slice(1),k=T.some(t=>t[0]==h)?h:'overview';nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.t==k));m.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==k));scrollTo(0,0)};
addEventListener('hashchange',go);go();
})();
